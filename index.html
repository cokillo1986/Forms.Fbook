<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formulario de contacto</title>

<meta
name="description"
content="Formulario de contacto para enviar una solicitud."

>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef2f6,
            #dce2e8
        );

    color: #1f2937;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}

.contenedor {

    width: 100%;

    max-width: 430px;

    background: #ffffff;

    border-radius: 16px;

    padding: 32px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.12);

}

.icono {

    width: 58px;

    height: 58px;

    margin: 0 auto 18px;

    border-radius: 50%;

    background: #2563eb;

    color: #ffffff;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 24px;

    font-weight: bold;

}

h1 {

    margin: 0 0 10px;

    text-align: center;

    font-size: 26px;

    color: #111827;

}

.descripcion {

    margin: 0 0 28px;

    text-align: center;

    color: #6b7280;

    font-size: 15px;

    line-height: 1.5;

}

.grupo {

    margin-bottom: 18px;

}

label {

    display: block;

    margin-bottom: 7px;

    font-size: 14px;

    font-weight: bold;

    color: #374151;

}

input {

    width: 100%;

    height: 48px;

    padding: 0 14px;

    border: 1px solid #d1d5db;

    border-radius: 9px;

    background: #ffffff;

    font-size: 16px;

    color: #111827;

    outline: none;

}

input:focus {

    border-color: #2563eb;

    box-shadow:
        0 0 0 3px rgba(37,99,235,0.12);

}

button {

    width: 100%;

    height: 50px;

    border: none;

    border-radius: 9px;

    background: #2563eb;

    color: #ffffff;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    background: #1d4ed8;

}

button:disabled {

    background: #9ca3af;

    cursor: not-allowed;

}

.informacion {

    margin-top: 20px;

    padding: 13px;

    border-radius: 9px;

    background: #f3f4f6;

    color: #6b7280;

    font-size: 12px;

    line-height: 1.5;

    text-align: center;

}

.mensaje {

    display: none;

    margin-top: 18px;

    padding: 13px;

    border-radius: 9px;

    text-align: center;

    font-size: 14px;

}

.mensaje.enviando {

    display: block;

    background: #eff6ff;

    color: #1d4ed8;

}

.mensaje.correcto {

    display: block;

    background: #ecfdf5;

    color: #047857;

}

.mensaje.error {

    display: block;

    background: #fef2f2;

    color: #b91c1c;

}

.pie {

    margin-top: 22px;

    text-align: center;

    color: #9ca3af;

    font-size: 11px;

}

@media (max-width: 480px) {

    .contenedor {

        padding: 25px 20px;

    }

    h1 {

        font-size: 23px;

    }

}

</style>

</head>

<body>

<div class="contenedor">

```
<div class="icono">
    C
</div>


<h1>
    Formulario de contacto
</h1>


<p class="descripcion">
    Completa tus datos para enviar tu solicitud.
</p>


<form
    id="formulario"
    action="https://script.google.com/macros/s/AKfycbx-ndeZ6qUG74z5NI_KwFuZ3uTIOtrng0_EByVs2sTUSn2QSFBvb3JTMUS_0YHJx7R8/exec"
    method="POST"
    target="iframeEnvio"
>

    <div class="grupo">

        <label for="nombre">
            Nombre
        </label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Escribe tu nombre"
            autocomplete="given-name"
            required
        >

    </div>


    <div class="grupo">

        <label for="apellidos">
            Apellidos
        </label>

        <input
            type="text"
            id="apellidos"
            name="apellidos"
            placeholder="Escribe tus apellidos"
            autocomplete="family-name"
            required
        >

    </div>


    <button
        type="submit"
        id="botonEnviar"
    >
        Enviar datos
    </button>

</form>


<div
    id="mensaje"
    class="mensaje"
></div>


<div class="informacion">

    Los datos introducidos se utilizarán únicamente
    para gestionar esta solicitud y contactar contigo
    cuando sea necesario.

</div>


<div class="pie">

    Formulario de contacto

</div>
```

</div>

<iframe
    name="iframeEnvio"
    id="iframeEnvio"
    style="display:none;"
></iframe>

<script>

const formulario =
    document.getElementById("formulario");

const botonEnviar =
    document.getElementById("botonEnviar");

const mensaje =
    document.getElementById("mensaje");

const iframeEnvio =
    document.getElementById("iframeEnvio");


formulario.addEventListener(
    "submit",
    function () {

        botonEnviar.disabled = true;

        botonEnviar.textContent =
            "Enviando...";

        mensaje.className =
            "mensaje enviando";

        mensaje.textContent =
            "Enviando tus datos...";

    }
);


iframeEnvio.addEventListener(
    "load",
    function () {

        if (!botonEnviar.disabled) {
            return;
        }

        setTimeout(
            function () {

                botonEnviar.disabled = false;

                botonEnviar.textContent =
                    "Enviar datos";

                mensaje.className =
                    "mensaje correcto";

                mensaje.textContent =
                    "Los datos se han enviado correctamente.";

                formulario.reset();

            },
            800
        );

    }
);

</script>

</body>

</html>
